        value: "jdbc:mysql://tt1-katteboinasrishanthya-ff69.i.aivencloud.com:20037/restaurant_db?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
