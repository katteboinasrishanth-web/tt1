spring.application.name=reservation-system

# MySQL connection settings (overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Jackson / JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${PORT:8080}

# Dining policy
# A booking is a window, not a dot: the table is held from (slot - occasion setup
# buffer) until (slot + duration). Lower the duration if your tables turn faster.
tt1.dining.duration-minutes=90

# Logging
logging.level.org.hibernate.SQL=WARN
